<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <h1>Tic Tac Toe</h1>
        <p class="app__status" id="status">Player X's turn</p>
      </header>

      <section class="board" id="board" aria-label="Tic Tac Toe board">
        <button class="cell" data-index="0" aria-label="Cell 1"></button>
        <button class="cell" data-index="1" aria-label="Cell 2"></button>
        <button class="cell" data-index="2" aria-label="Cell 3"></button>
        <button class="cell" data-index="3" aria-label="Cell 4"></button>
        <button class="cell" data-index="4" aria-label="Cell 5"></button>
        <button class="cell" data-index="5" aria-label="Cell 6"></button>
        <button class="cell" data-index="6" aria-label="Cell 7"></button>
        <button class="cell" data-index="7" aria-label="Cell 8"></button>
        <button class="cell" data-index="8" aria-label="Cell 9"></button>
      </section>

      <section class="controls">
        <button id="reset" class="reset">Reset Game</button>
      </section>

      <section class="scoreboard" aria-label="Scoreboard">
        <div>
          <span class="scoreboard__label">Player X</span>
          <span class="scoreboard__value" id="score-x">0</span>
        </div>
        <div>
          <span class="scoreboard__label">Player O</span>
          <span class="scoreboard__value" id="score-o">0</span>
        </div>
        <div>
          <span class="scoreboard__label">Ties</span>
          <span class="scoreboard__value" id="score-ties">0</span>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
